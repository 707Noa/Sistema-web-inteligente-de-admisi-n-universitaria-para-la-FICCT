services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cupficct
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_URL=${APP_URL:-http://localhost:${BACKEND_PORT:-8000}}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - DATABASE_URL=${DATABASE_URL}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-cupficct}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,localhost:8000,127.0.0.1:5173}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-localhost}
    command: >
      sh -c "composer install &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             (php artisan storage:link || true) &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:8000/api}
      - VITE_AI_URL=${AI_URL:-http://localhost/ai}
      - VITE_WS_URL=${WS_URL:-ws://localhost/ws}
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${NGINX_PORT_HTTP:-80}:80"
      - "${NGINX_PORT_HTTPS:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d-templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    command: >
      sh -c 'if [ "${APP_ENV:-local}" = "prod" ]; then
                # Start nginx in HTTP-only mode (serves ACME webroot). When certs exist, replace config and reload.
                cp /etc/nginx/conf.d-templates/app_http_only.conf /etc/nginx/conf.d/default.conf;
                nginx -g "daemon off;" &
                # wait for certs to appear and then switch to TLS config
                while [ ! -f /etc/nginx/certs/fullchain.pem ] || [ ! -f /etc/nginx/certs/privkey.pem ]; do
                  echo "Waiting for TLS certificates...";
                  sleep 2;
                done;
                cp /etc/nginx/conf.d-templates/app.conf /etc/nginx/conf.d/default.conf;
                nginx -s reload;
                wait
              else
                cp /etc/nginx/conf.d-templates/local.conf /etc/nginx/conf.d/default.conf;
                nginx -g "daemon off;"
              fi'

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/www:/var/www/certbot
      - ./nginx/certs:/var/www/certs
    environment:
      - APP_ENV=${APP_ENV:-local}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERTBOT_CERT_NAME=${CERTBOT_CERT_NAME}
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
    depends_on:
      - nginx
    restart: unless-stopped
    command: >
      sh -c 'if [ "${APP_ENV:-local}" = "prod" ]; then
                mkdir -p /var/www/certs /var/www/certbot;
                while true; do
                  # build -d args from space-separated CERTBOT_DOMAINS
                  args=""; for d in ${CERTBOT_DOMAINS}; do args="$args -d $d"; done;
                  certbot certonly --webroot -w /var/www/certbot $args -m ${CERTBOT_EMAIL} --agree-tos --non-interactive || true;
                  if [ -d "/etc/letsencrypt/live/${CERTBOT_CERT_NAME}" ]; then
                    cp -L /etc/letsencrypt/live/${CERTBOT_CERT_NAME}/fullchain.pem /var/www/certs/ || true;
                    cp -L /etc/letsencrypt/live/${CERTBOT_CERT_NAME}/privkey.pem /var/www/certs/ || true;
                  fi;
                  sleep 12h;
                done;
              else
                echo "Certbot disabled in non-prod environment";
                sleep infinity;
              fi'

volumes:
  pgdata:
  pgadmindata:
  backend_vendor:
  frontend_modules:
